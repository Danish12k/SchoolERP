<div class="matero-page-header-inner">
  <div class="matero-page-header__title-block">
    <div class="matero-page-title" role="heading" aria-level="1">
      {{ title | translate }}
    </div>
    @if (subtitle) {
      <p class="matero-page-subtitle">{{ subtitle }}</p>
    }
  </div>

  @if (!hideBreadcrumb) {
    <breadcrumb class="matero-page-header__breadcrumb" [nav]="nav" />
  }
</div>
