<div class="add-grade-subject">
  <div class="add-grade-subject__layout">
    <mat-card class="admin-page__card add-grade-subject__form-card">
      <mat-card-content>
        <form class="add-grade-subject__form" (ngSubmit)="addSubject()">
          <mat-form-field appearance="outline" class="add-grade-subject__field">
            <mat-label>Subject Type</mat-label>
            <mat-select [value]="gradeSubjectType" disabled>
              <mat-option [value]="gradeSubjectType">Grade Subject</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="add-grade-subject__field">
            <mat-label>Subject Code</mat-label>
            <input matInput name="subjectCode" [(ngModel)]="newSubject.subjectCode" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="add-grade-subject__field">
            <mat-label>Subject Name</mat-label>
            <input matInput name="subjectName" [(ngModel)]="newSubject.subjectName" maxlength="50" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="add-grade-subject__field">
            <mat-label>Sequence</mat-label>
            <input matInput type="number" name="subjectSeq" [(ngModel)]="newSubject.subjectSeq" min="1" required />
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" [disabled]="isSaving">Submit</button>
        </form>
      </mat-card-content>
    </mat-card>

    <mat-card class="admin-page__card add-grade-subject__table-card">
      <mat-card-content>
        <table mat-table [dataSource]="dataSource" matSort class="add-grade-subject__table mat-elevation-z0">
          <ng-container matColumnDef="subjectCode">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Subject Code</th>
            <td mat-cell *matCellDef="let row">{{ row.subjectCode }}</td>
          </ng-container>

          <ng-container matColumnDef="subjectName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Subject Name</th>
            <td mat-cell *matCellDef="let row">{{ row.subjectName }}</td>
          </ng-container>

          <ng-container matColumnDef="subjectSeq">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Sequence</th>
            <td mat-cell *matCellDef="let row">{{ row.subjectSeq }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="add-grade-subject__actions-col">Actions</th>
            <td mat-cell *matCellDef="let row">
              <button
                mat-icon-button
                color="primary"
                type="button"
                (click)="openEditDialog(row)"
                matTooltip="Edit subject"
              >
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell add-grade-subject__empty" [attr.colspan]="displayedColumns.length">
              No grade subjects found.
            </td>
          </tr>
        </table>

        <mat-paginator
          class="add-grade-subject__paginator"
          [pageSize]="10"
          [pageSizeOptions]="[5, 10, 25, 50]"
          showFirstLastButtons
        />
      </mat-card-content>
    </mat-card>
  </div>
</div>

<ng-template #editDialog let-data>
  <h2 mat-dialog-title>Edit Grade Subject</h2>
  <mat-dialog-content class="admin-dialog__content">
    <mat-form-field appearance="outline" class="admin-dialog__field">
      <mat-label>Subject code</mat-label>
      <input matInput [(ngModel)]="data.subjectCode" name="editSubjectCode" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="admin-dialog__field">
      <mat-label>Subject name</mat-label>
      <input matInput [(ngModel)]="data.subjectName" name="editSubjectName" maxlength="50" required />
    </mat-form-field>
    <mat-form-field appearance="outline" class="admin-dialog__field">
      <mat-label>Sequence</mat-label>
      <input matInput type="number" [(ngModel)]="data.subjectSeq" name="editSubjectSeq" min="1" required />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      type="button"
      [mat-dialog-close]="data"
      [disabled]="!data.subjectName?.trim() || !data.subjectCode?.trim() || !data.subjectSeq"
    >
      Update
    </button>
  </mat-dialog-actions>
</ng-template>
