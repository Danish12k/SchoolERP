<div class="admin-layout">
  <page-header class="admin-layout__header" />

  <section class="admin-page" aria-label="Class and section management">
    <mat-card class="admin-page__card admin-page__card--tabs">
      <mat-card-content class="admin-page__content admin-page__content--tabs">
        <div class="class-section-tabs" role="tablist" aria-label="Class and section sections">
          @for (tab of tabs; track tab.key) {
            <button
              type="button"
              class="class-section-tabs__button"
              [class.class-section-tabs__button--active]="selectedTab === tab.key"
              role="tab"
              [attr.aria-selected]="selectedTab === tab.key"
              (click)="selectedTab = tab.key"
            >
              {{ tab.label }}
            </button>
          }
        </div>

        <div class="class-section-content">
          @switch (selectedTab) {
            @case ('class') {
            <app-classmaster [embedded]="true" />
            }
            @case ('section') {
            <app-section [embedded]="true" />
            }
            @case ('assignSection') {
            <app-assign-section [embedded]="true" />
            }
            @case ('assignTeacher') {
            <app-assign-class-teacher [embedded]="true" />
            }
          }
        </div>
      </mat-card-content>
    </mat-card>
  </section>
</div>
