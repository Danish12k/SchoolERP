<div class="admin-layout">
  <page-header class="admin-layout__header" title="Fee Master" [nav]="['home', 'Admin', 'Fee Master']" />

  <section class="admin-page" aria-label="Fee master">
    <mat-card class="admin-page__card admin-page__card--tabs">
      <mat-card-content class="admin-page__content admin-page__content--tabs">
        <div class="fee-master-tabs" role="tablist" aria-label="Fee master sections">
          @for (tab of tabs; track tab.key) {
            <button
              type="button"
              class="fee-master-tabs__button"
              [class.fee-master-tabs__button--active]="selectedTab === tab.key"
              role="tab"
              [attr.aria-selected]="selectedTab === tab.key"
              (click)="selectedTab = tab.key"
            >
              {{ tab.label }}
            </button>
          }
        </div>

        <div class="fee-master-content">
          @switch (selectedTab) {
            @case ('feeGroup') {
              <app-fee-group [embedded]="true" />
            }
            @case ('feeHead') {
              <app-fee-head [embedded]="true" />
            }
            @case ('feeInstallment') {
              <app-fee-installment [embedded]="true" />
            }
            @case ('allocateFee') {
              <app-allocate-fee />
            }
          }
        </div>
      </mat-card-content>
    </mat-card>
  </section>
</div>
