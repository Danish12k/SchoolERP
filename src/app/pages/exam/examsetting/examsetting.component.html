<div class="admin-layout">
  <page-header class="admin-layout__header" title="Exam Setting Master" [nav]="['home', 'Admin', 'Exam Setting Master']" />

  <section class="admin-page" aria-label="Exam setting management">
    <mat-card class="admin-page__card admin-page__card--tabs">
      <mat-card-content class="admin-page__content admin-page__content--tabs">
        <div class="class-section-tabs" role="tablist" aria-label="Exam setting sections">
          @for (tab of tabs; track tab.key) {
            <button
              type="button"
              class="class-section-tabs__button"
              [class.class-section-tabs__button--active]="selectedTab === tab.key"
              role="tab"
              [attr.aria-selected]="selectedTab === tab.key"
              (click)="selectedTab = tab.key"
            >
              {{ tab.label }}
            </button>
          }
        </div>

        <div class="class-section-content">
          @switch (selectedTab) {
            @case ('examMaster') {
              <app-exam-master [embedded]="true" />
            }
            @case ('subExam') {
              <app-sub-exam [embedded]="true" />
            }
            @case ('gradePoint') {
              <app-add-grade-point [embedded]="true" />
            }
            @case ('classGroup') {
              <app-class-group [embedded]="true" />
            }
          }
        </div>
      </mat-card-content>
    </mat-card>
  </section>
</div>
