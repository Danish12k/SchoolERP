<div class="sub-exam">
  <mat-card class="admin-page__card">
    <mat-card-header>
      <mat-card-title>Add Sub Exam</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="sub-exam__form">
        <mat-form-field appearance="outline">
          <mat-label>Exam Name</mat-label>
          <input matInput [(ngModel)]="examName" />
        </mat-form-field>
      </div>

      <div class="sub-exam__actions">
        <button mat-flat-button color="primary" type="button" [disabled]="isSaving" (click)="saveSubExam()">
          Save
        </button>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="admin-page__card">
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" class="sub-exam__table">
        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let row; let i = index">{{ rowIndex(i) }}</td>
        </ng-container>

        <ng-container matColumnDef="examName">
          <th mat-header-cell *matHeaderCellDef>Exam Name</th>
          <td mat-cell *matCellDef="let row">{{ row.examName }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
    </mat-card-content>
  </mat-card>
</div>
